version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    ignore:
      # Astro is not yet compatible with TypeScript 7.
      - dependency-name: typescript
        versions: [">= 7"]
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
      # Own reusable workflows (christoph-sens/ci-workflows) need no waiting period.
      exclude: ["christoph-sens/*"]
    groups:
      github-actions-minor-and-patch:
        update-types: [minor, patch]
